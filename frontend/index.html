<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cascade cyber twin</title>
<style>
  /* ---------- fonts (shipped locally, see DESIGN.md) ---------- */
  @font-face { font-family: "Big Shoulders Display"; font-weight: 600; font-display: swap; src: url(/vendor/fonts/big-shoulders-display-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Big Shoulders Display"; font-weight: 700; font-display: swap; src: url(/vendor/fonts/big-shoulders-display-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Big Shoulders Display"; font-weight: 800; font-display: swap; src: url(/vendor/fonts/big-shoulders-display-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family: "Plus Jakarta Sans"; font-weight: 400; font-display: swap; src: url(/vendor/fonts/plus-jakarta-sans-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Plus Jakarta Sans"; font-weight: 500; font-display: swap; src: url(/vendor/fonts/plus-jakarta-sans-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Plus Jakarta Sans"; font-weight: 600; font-display: swap; src: url(/vendor/fonts/plus-jakarta-sans-latin-600-normal.woff2) format("woff2"); }

  /* ---------- tokens ---------- */
  :root {
    --abyss: #050B24; --deep: #0A1640; --navy: #12225E; --sheet-2: #1A2C72; --line: #2B3D86;
    --white: #FFFFFF; --mute: #A9B4DA; --pink: #FF6FB5; --pink-deep: #E43F8E; --bar-soft: #8E9DE0;
    --display: "Big Shoulders Display", sans-serif;
    --body: "Plus Jakarta Sans", sans-serif;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 72px;
    --dossier-w: 400px; --rail-w: 260px; --ticker-h: 84px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: clip; background: var(--abyss); color: var(--white); font-family: var(--body); font-size: 14px; line-height: 1.45; }
  body { overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
  h2 { font-family: var(--display); font-weight: 700; font-size: 27px; line-height: 1.05; margin: 0 0 var(--s3); letter-spacing: .01em; }
  h3 { font-family: var(--display); font-weight: 700; font-size: 20px; margin: var(--s5) 0 var(--s2); letter-spacing: .01em; }
  .hint { color: var(--mute); margin: 0 0 var(--s3); max-width: 62ch; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- shell ---------- */
  .app { position: relative; height: 100vh; }
  .stage { position: absolute; inset: 0; overflow: hidden; background: var(--abyss); }
  .stage canvas { display: block; }
  #labels { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .stage::before { content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: linear-gradient(90deg, rgba(5,11,36,.94) 0, rgba(5,11,36,.86) 270px, rgba(5,11,36,0) 350px),
                linear-gradient(180deg, rgba(5,11,36,.75) 0, rgba(5,11,36,0) 70px); }

  .nav { position: absolute; top: var(--s4); left: var(--s5); right: calc(var(--dossier-w) + var(--s5) * 2); z-index: 4; display: flex; align-items: center; gap: var(--s5); }
  .brand { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; letter-spacing: .02em; }
  .tabs { display: flex; gap: var(--s1); }
  .tabs button { white-space: nowrap; background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 2px; margin-right: var(--s3); cursor: pointer; color: var(--mute); font-weight: 500; min-height: 36px; }
  .tabs button[aria-selected="true"] { color: var(--white); border-bottom-color: var(--white); }
  .menu { display: none; }
  .simnote { margin-left: auto; color: var(--mute); font-size: 12px; white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: help; }

  /* left column: clock, first-screen question, then the rail. Stacked, so they never collide. */
  .clockblock { position: absolute; top: 64px; left: var(--s5); bottom: calc(var(--ticker-h) + var(--s5) + var(--s4)); z-index: 3; pointer-events: none; display: flex; flex-direction: column; }
  .clockblock > * { pointer-events: auto; }
  .clock { align-self: flex-start; font-family: var(--display); font-weight: 800; font-size: 96px; line-height: .9; letter-spacing: .01em; display: flex; }
  .clock span { display: inline-block; text-align: center; }
  .clock .d { width: .5em; }
  .clock .sep { width: .24em; }
  .clock .plus { width: .5em; }
  .clock .tchar { width: .5em; }
  .clock.alarm { color: var(--pink); }
  .clocksub { font-size: 17.5px; color: var(--mute); margin-top: var(--s2); max-width: 26em; min-height: 1.4em; }
  .clocksub b { color: var(--white); font-weight: 600; }
  .clock.alarm + .clocksub b { color: var(--pink); }
  .hero { margin-top: var(--s5); max-width: 22em; }
  .hero p { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1.05; margin: 0 0 var(--s4); }
  .hero .row { gap: var(--s3); }
  .hero small { color: var(--mute); font-size: 13px; }

  .rail { flex: 1 1 auto; min-height: 0; margin-top: var(--s5); width: var(--rail-w); overflow-y: auto; padding-right: var(--s2); }
  .sheet { background: var(--navy); border: 1px solid var(--line); border-radius: 14px; }
  .dossier { position: absolute; right: var(--s5); top: 72px; bottom: calc(var(--ticker-h) + var(--s5) + var(--s4)); width: var(--dossier-w); z-index: 3; overflow-y: auto; padding: var(--s5); }
  .card { position: absolute; right: calc(var(--s5) + var(--s4)); top: 88px; bottom: calc(var(--ticker-h) + var(--s5)); width: var(--dossier-w); z-index: 5; overflow-y: auto; padding: var(--s5);
          background: var(--sheet-2); transform: translateX(calc(100% + 60px)); visibility: hidden; transition: transform .26s cubic-bezier(.2,.7,.2,1), visibility 0s linear .26s; }
  .card.open { transform: none; visibility: visible; transition: transform .26s cubic-bezier(.2,.7,.2,1), visibility 0s; }
  .ticker { position: absolute; left: var(--s5); right: var(--s5); bottom: var(--s5); height: var(--ticker-h); z-index: 4; display: grid; grid-template-columns: auto 1fr auto; gap: var(--s4); align-items: center; padding: 0 var(--s4); }

  .caption { position: absolute; top: 210px; z-index: 3; font-family: var(--display); font-size: 22px; font-weight: 700; display: none; max-width: 30%; line-height: 1.1; padding: 8px 12px; background: rgba(5,11,36,.88); border-radius: 8px; }
  .caption.after { color: var(--white); }
  .caption.before { color: var(--mute); }
  .split .caption { display: block; }
  .divider { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); display: none; z-index: 2; }
  .split .divider { display: block; }
  .banner { position: absolute; left: 50%; top: var(--s4); transform: translateX(-50%); z-index: 6; padding: var(--s2) var(--s4); background: var(--navy); border: 1px solid var(--line); border-radius: 8px; display: none; max-width: 60%; }
  .banner.show { display: block; }
  .banner.error { border-color: var(--pink); }

  /* ---------- labels in the 3D scene ---------- */
  .label { font-size: 11.5px; padding: 2px 7px; border-radius: 3px; background: rgba(5, 11, 36, .86); border: 1px solid var(--line); white-space: nowrap; transition: opacity .18s; }
  .label.culled { opacity: 0 !important; pointer-events: none; }
  .atkdot { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; color: #fff; font: 700 11px/1 var(--font, system-ui); margin-right: 8px; flex: none; vertical-align: -3px; }
  .atkdot.sm { width: 16px; height: 16px; font-size: 10px; margin: 0 6px 0 0; }
  .atkline { display: flex; gap: 2px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .atkline small { display: block; color: var(--mute); font-size: 12px; margin-top: 2px; }
  .atkline small.adapt { color: #F2B84B; }
  .atkline .m { color: var(--mute); font-weight: 400; }
  .scnbox { display: grid; gap: 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; margin: 8px 0 4px; font-size: 13px; }
  .scnbox > span { color: var(--mute); display: flex; align-items: center; flex-wrap: wrap; }
  .scnbox .linkbtn { justify-self: start; background: none; border: 0; color: var(--white); text-decoration: underline; padding: 0; font: inherit; cursor: pointer; }
  .ctxstart { display: flex; align-items: center; gap: 6px; padding: 8px 12px; font-size: 12.5px; color: var(--mute); }
  .ctxstart input { width: 64px; background: rgba(255,255,255,.06); color: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font: inherit; }
  .label.culled:focus-visible { opacity: 1 !important; }
  .label.minor { opacity: .78; }
  .label.anomaly { border-color: #F2B84B; }
  .label[data-atk]:not([data-atk=""]) { border-color: var(--atk); box-shadow: inset 3px 0 0 var(--atk); }
  .label.breach[data-atk]:not([data-atk=""]) small { color: var(--atk); }
  .label.anomaly small { color: #F2B84B; }
  .label small { color: var(--mute); margin-left: 6px; font-variant-numeric: tabular-nums; font-size: 11px; }
  .label.breach { border-color: var(--pink); }
  .label.breach small { color: var(--pink); }
  .label.selected { border-color: var(--white); }

  /* ---------- rail ---------- */
  .service { padding: var(--s3) 0 var(--s3) var(--s3); border-left: 2px solid var(--white); margin-bottom: var(--s2); background: rgba(5,11,36,.55); border-radius: 0 8px 8px 0; }
  .service.backup { border-left-color: var(--pink); border-left-style: dashed; }
  .service.lost { border-left-color: var(--pink-deep); border-left-width: 4px; }
  .service .name { font-weight: 600; }
  .service .state { font-size: 13px; color: var(--mute); }
  .service.lost .state, .service.backup .state { color: var(--pink); }
  .service .count { font-family: var(--display); font-size: 27px; font-weight: 700; line-height: 1.1; }
  .detect { font-size: 13px; padding: var(--s2) var(--s3); border-radius: 8px; background: rgba(5,11,36,.55); color: var(--mute); }
  .detect.on { color: var(--white); }
  .log { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .log li { display: grid; grid-template-columns: 62px 1fr; gap: var(--s2); padding: 6px 0; border-bottom: 1px solid rgba(43,61,134,.6); color: var(--mute); }
  .log .when { color: var(--white); font-variant-numeric: tabular-nums; }
  .log .compromise .what { color: var(--white); }
  .log .service_down .what { color: var(--pink); font-weight: 600; }
  .legend { display: grid; gap: 6px; font-size: 12px; color: var(--mute); margin-top: var(--s5); }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 8px; vertical-align: -1px; }
  .rail h3:first-child { margin-top: 0; }

  /* ---------- ticker ---------- */
  .play { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--white); color: var(--deep); cursor: pointer; font-size: 16px; }
  .trackwrap { display: grid; gap: 6px; min-width: 0; }
  .track { position: relative; height: 26px; }
  .track input { position: absolute; inset: 0; width: 100%; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; z-index: 2; cursor: pointer; }
  .track input::-webkit-slider-runnable-track { height: 2px; background: var(--line); }
  .track input::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -7px; border-radius: 50%; background: var(--white); }
  .track input::-moz-range-track { height: 2px; background: var(--line); }
  .track input::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: var(--white); }
  .ticks { position: absolute; left: 8px; right: 8px; top: 0; bottom: 0; pointer-events: none; }
  .tick { position: absolute; top: 7px; width: 2px; height: 12px; background: var(--mute); }
  .tick.compromise { background: var(--pink); opacity: .7; }
  .tick.service_down { background: var(--pink); height: 26px; top: 0; width: 3px; opacity: 1; }
  .tick.detected, .tick.contained { background: var(--white); }
  .latest { font-size: 13px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .latest b { color: var(--white); font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 8px; }
  .rate { display: flex; gap: 2px; }
  .rate button { border: 1px solid transparent; background: none; padding: 6px 10px; border-radius: 8px; color: var(--mute); cursor: pointer; font-variant-numeric: tabular-nums; min-height: 36px; }
  .rate button[aria-pressed="true"] { border-color: var(--line); color: var(--white); }

  /* ---------- controls ---------- */
  .row { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
  .btn { border: 1px solid rgba(255,255,255,.3); background: transparent; border-radius: 8px; padding: 10px 16px; cursor: pointer; font-weight: 500; min-height: 44px; }
  .btn:hover { border-color: var(--white); }
  .btn.primary { background: var(--white); color: var(--deep); border-color: var(--white); font-weight: 600; }
  .btn[disabled] { opacity: .55; cursor: wait; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 13px; cursor: pointer; min-height: 36px; }
  .chip[aria-pressed="true"] { border-color: var(--pink); background: rgba(255,111,181,.16); }
  .chip small { color: var(--mute); margin-left: 6px; font-variant-numeric: tabular-nums; }
  .field { display: grid; gap: 6px; margin-bottom: var(--s3); }
  .field label { font-size: 13px; color: var(--mute); display: flex; justify-content: space-between; }
  .field label b { color: var(--white); font-variant-numeric: tabular-nums; }
  input[type=range].plain { width: 100%; accent-color: var(--white); }
  input[type=number], select { background: var(--deep); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-height: 40px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }

  .figures { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); margin: var(--s3) 0; }
  .figures div { padding: var(--s3) 0; border-bottom: 1px solid var(--line); }
  .figures div:nth-child(odd) { padding-right: var(--s3); border-right: 1px solid var(--line); }
  .figures div:nth-child(even) { padding-left: var(--s3); }
  .figures dt { font-size: 12px; color: var(--mute); }
  .figures dd { margin: 2px 0 0; font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .figures dd.bad { color: var(--pink); }
  .figures dd.small { font-size: 20px; font-family: var(--body); font-weight: 600; }

  .fix { padding: var(--s3) 0; border-bottom: 1px solid var(--line); }
  .fix .head { display: flex; align-items: center; gap: var(--s3); }
  .fix .head label { flex: 1; cursor: pointer; font-weight: 600; line-height: 1.3; }
  .fix input[type=checkbox] { accent-color: var(--white); width: 18px; height: 18px; }
  .kind { font-size: 11px; color: var(--mute); border: 1px solid var(--line); border-radius: 3px; padding: 1px 6px; }
  .bars { display: grid; grid-template-columns: 92px 1fr 52px; gap: 4px var(--s2); align-items: center; margin-top: var(--s2); font-size: 12px; color: var(--mute); }
  .bar { height: 5px; background: var(--deep); border-radius: 3px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--bar-soft); }
  .bar.worst > span { background: var(--white); }
  .bars .v { text-align: right; color: var(--white); font-variant-numeric: tabular-nums; }
  .fix .note { font-size: 12px; color: var(--pink); margin-top: 6px; }
  .fix .meta { font-size: 12px; color: var(--mute); margin-top: 6px; }
  .bundle { list-style: none; padding: 0; margin: 0 0 var(--s3); counter-reset: b; }
  .bundle li { padding: 9px 0 9px 32px; border-bottom: 1px solid var(--line); position: relative; font-weight: 600; }
  .bundle li::before { counter-increment: b; content: counter(b); position: absolute; left: 0; top: 7px; font-family: var(--display); font-size: 20px; color: var(--mute); }
  .moved { line-height: 1.55; padding: var(--s3) 0; margin-bottom: var(--s3); border-bottom: 1px solid var(--line); }
  .moved b { color: var(--pink); }
  .runner { font-size: 12px; color: var(--mute); padding: 7px 0; border-bottom: 1px solid var(--line); }

  /* ---------- fix ranking: rank, filter, assumption test ---------- */
  .fix { display: grid; grid-template-columns: 34px 1fr; column-gap: var(--s2); }
  .fix > .rank { font-family: var(--display); font-weight: 700; font-size: 22px; color: var(--mute); line-height: 1.1; padding-top: 1px; }
  .fix.first > .rank { color: var(--white); font-size: 34px; }
  .fix.first .head label { font-size: 17.5px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 var(--s3); }
  .filters .chip[aria-pressed="true"] { border-color: var(--white); background: rgba(255,255,255,.1); }
  .stability { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; margin: var(--s2) 0 var(--s1); }
  .stability small { font-family: var(--body); font-weight: 500; font-size: 14px; color: var(--mute); margin-left: var(--s2); }
  .run { display: grid; grid-template-columns: 1fr auto; gap: 2px var(--s3); padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .run .what { color: var(--white); }
  .run .change { color: var(--mute); font-variant-numeric: tabular-nums; text-align: right; }
  .run .result { grid-column: 1 / -1; color: var(--mute); }
  .run.changed .result { color: var(--pink); }

  /* ---------- response plan ---------- */
  .callout { font-size: 17.5px; line-height: 1.4; padding: var(--s3) 0 var(--s4); border-bottom: 1px solid var(--line); margin-bottom: var(--s2); }
  .callout b { font-family: var(--display); font-weight: 800; font-size: 34px; display: block; line-height: 1; margin-bottom: 6px; }
  .callout.bad b { color: var(--pink); }
  .steps { list-style: none; margin: 0; padding: 0; }
  .step { display: grid; grid-template-columns: 78px 1fr; gap: 2px var(--s3); padding: var(--s3) 0; border-bottom: 1px solid var(--line); }
  .step .by { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .step .by small { display: block; font-family: var(--body); font-size: 11px; font-weight: 500; color: var(--mute); margin-top: 2px; }
  .step .act { font-weight: 600; line-height: 1.35; }
  .step .reason { grid-column: 2; font-size: 13px; color: var(--mute); margin-top: 2px; }
  .step .status { grid-column: 2; font-size: 12px; color: var(--mute); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
  .step .by { grid-row: span 3; }
  .step.missed .by, .step.missed .status .left { color: var(--pink); }
  .step.missed .act { color: var(--mute); }
  .step.svc .act::before { content: ''; display: inline-block; width: 8px; height: 8px; border: 1px solid var(--white); border-radius: 50%; margin-right: 8px; vertical-align: 1px; }

  /* ---------- nav tools: graphics + present ---------- */
  .navtools { display: flex; gap: var(--s1); }
  .navbtn { background: none; border: 1px solid transparent; border-radius: 8px; color: var(--mute); padding: 6px 10px; cursor: pointer; min-height: 36px; white-space: nowrap; font-weight: 500; }
  .navbtn:hover, .navbtn[aria-pressed="true"] { color: var(--white); border-color: var(--line); }

  /* ---------- performance meter ---------- */
  .perf { position: absolute; z-index: 6; top: 64px; left: 50%; transform: translateX(-50%); padding: var(--s3) var(--s4); display: grid; grid-template-columns: auto auto; gap: var(--s2) var(--s5); align-items: center; }
  .perf[hidden] { display: none; }
  .perf .fps { font-family: var(--display); font-weight: 800; font-size: 42px; line-height: .9; font-variant-numeric: tabular-nums; }
  .perf .fps small { font-family: var(--body); font-size: 13px; font-weight: 500; color: var(--mute); margin-left: 6px; }
  .perf .detail { font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .perf .quality { grid-column: 1 / -1; display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--mute); }
  .perf .quality span { margin-right: 6px; }
  .perf .quality button { border: 1px solid var(--line); background: none; border-radius: 6px; padding: 5px 10px; cursor: pointer; min-height: 32px; }
  .perf .quality button[aria-pressed="true"] { border-color: var(--white); background: rgba(255,255,255,.1); }

  /* ---------- presenter ---------- */
  .present { position: absolute; z-index: 6; left: 50%; transform: translateX(-50%); bottom: calc(var(--ticker-h) + var(--s5) + var(--s4)); width: min(560px, calc(100% - 2 * var(--s5))); padding: var(--s4) var(--s5); background: var(--sheet-2); }
  .present[hidden] { display: none; }
  .present .count { font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .present h3 { margin: 2px 0 6px; font-size: 27px; }
  .present p { margin: 0 0 var(--s3); font-size: 15px; line-height: 1.5; min-height: 3em; }
  .present .row { justify-content: flex-end; }
  .present .row .exit { margin-right: auto; }
  .presenting .hero { display: none !important; }

  /* ---------- water monitoring tab ---------- */
  .wbanner { border: 1px solid rgba(242,184,75,.6); background: rgba(242,184,75,.08); border-radius: 10px; padding: 10px 12px; font-size: 12px; line-height: 1.45; margin-bottom: var(--s3); }
  .wbanner b { color: #F2B84B; }

</div>

<script type="module">

import { OrbitControls } from 'three/addons/OrbitControls.js';

// ======================================================================
// state and helpers
// ======================================================================
const S = {
  graph: null, tab: 'replay', T: 0, playing: false, rate: 6,
  entries: [], speed: 1, applied: new Set(), atk: null,   // atk: multi-attacker scenario (null = one attacker from S.entries at T+0)
  sim: null, fixes: null, opt: null, split: null, selected: null, overview: null, plan: null, sens: null, hover: null,

const ATK_HEX = { A: C.pink, B: 0x2A8FD6, C: 0x9A74F0, D: 0x2BA58A };
const ATK_CSS = { A: '#FF6FB5', B: '#2A8FD6', C: '#9A74F0', D: '#2BA58A' };

const shortName = n => { const ab = n.match(/\(([A-Z][A-Z0-9]{1,6})\)/); if (ab) return ab[1]; const s = n.replace(/\s*\(.*?\)\s*/g, ' ').trim(); if (s.length <= 22) return s; const w = s.slice(0, 22); return w.slice(0, w.lastIndexOf(' ') > 10 ? w.lastIndexOf(' ') : 22) + '…'; };
const $ = s => document.querySelector(s);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const H = () => S.graph?.horizon_min ?? 360;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtT = m => { m = Math.max(0, Math.round(m)); return `T+${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };
const fmtMin = m => { m = Math.max(0, Math.round(m)); return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m} min`; };   // round first: never "2h 60m"

const firstFail = m => m >= H() ? 'None in 6h' : fmtT(m);

async function api(path, body) {
  try {
    const res = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || `Request failed (${res.status})`); }
    hideBanner();

  } catch (err) {

    throw err;
  }
}
function showBanner(text, error = false) { const b = $('#banner'); b.textContent = text; b.className = 'banner show' + (error ? ' error' : ''); }

// ======================================================================
// renderer, scene, camera
// ======================================================================
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });

renderer.setClearColor(C.abyss);

renderer.shadowMap.type = THREE.PCFSoftShadowMap;

stage.prepend(renderer.domElement);
const labelRenderer = new CSS2DRenderer({ element: $('#labels') });
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(C.abyss, 80, 220);   // re-tuned to the camera distance in fitCamera()
const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 1600);
const controls = new OrbitControls(camera, renderer.domElement);

scene.add(new THREE.HemisphereLight(0xA9BCFF, 0x0A1640, 1.25));

moon.position.set(-40, 70, 30); moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);

scene.add(moon);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(512, 512), 0.65, 0.5, 0.72);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ======================================================================
// procedural textures
// ======================================================================
const texCache = new Map();
const letterCache = {};
function letterTex(id) {             // round badge with the attacker letter, used on beams and pulses
  if (letterCache[id]) return letterCache[id];
  const c = canvas(64, 64), g = c.getContext('2d');
  g.fillStyle = ATK_CSS[id] ?? ATK_CSS.A; g.beginPath(); g.arc(32, 32, 29, 0, Math.PI * 2); g.fill();
  g.lineWidth = 4; g.strokeStyle = '#FFFFFF'; g.stroke();
  g.fillStyle = '#FFFFFF'; g.font = '700 36px Outfit, system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(id, 32, 34);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return (letterCache[id] = t);
}
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function toTex(c, srgb = true, repeat) {
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }

function grain(g, w, h, r, amount, strength) {
  for (let i = 0; i < amount; i++) {
    const v = r();
    g.fillStyle = v > .5 ? `rgba(255,255,255,${strength * r()})` : `rgba(0,0,10,${strength * 1.6 * r()})`;
    g.fillRect(r() * w, r() * h, 1 + r() * 2.5, 1 + r() * 2.5);

/** Building facade: returns { map, emi } where emi holds the lit windows. Styles: grid, glass, band, rack, corrugated, hut. */
function facade(o) {
  const key = 'f' + JSON.stringify(o);
  if (texCache.has(key)) return texCache.get(key);
  const W = 256, Hh = 512, r = rng(o.seed ?? 1);
  const c1 = canvas(W, Hh), c2 = canvas(W, Hh), a = c1.getContext('2d'), e = c2.getContext('2d');
  a.fillStyle = o.base ?? '#26356E'; a.fillRect(0, 0, W, Hh);
  e.fillStyle = '#000'; e.fillRect(0, 0, W, Hh);
  grain(a, W, Hh, r, 2600, .05);
  const cols = o.cols ?? 6, rows = o.rows ?? 10, cw = W / cols, rh = Hh / rows, litP = o.lit ?? .6;
  const light = (x, y, w, h, warm) => {
    if (r() > litP) return;
    const b = .4 + .6 * r();
    e.fillStyle = warm && r() < .25 ? `rgba(255,236,250,${b})` : `rgba(255,255,255,${b})`;
    e.fillRect(x, y, w, h);
  };
  const glassFill = (x, y, w, h) => {
    const gr = a.createLinearGradient(x, y, x + w, y + h);
    gr.addColorStop(0, '#0B1642'); gr.addColorStop(1, '#16246A');
    a.fillStyle = gr; a.fillRect(x, y, w, h);

  switch (o.style) {
    case 'glass':
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {

        glassFill(px, py, w, h); light(px, py, w, h, true);

      a.fillStyle = 'rgba(190,205,255,.18)';
      for (let x = 0; x <= cols; x++) a.fillRect(x * cw - 1, 0, 2, Hh);
      break;
    case 'band':
      for (let y = 0; y < rows; y++) {
        if (y % 3 === 1) {
          const py = y * rh + rh * .15, h = rh * .7;
          glassFill(6, py, W - 12, h);
          for (let s = 0; s < 8; s++) light(8 + s * (W - 16) / 8, py + 2, (W - 16) / 8 - 3, h - 4, false);
        } else {
          a.fillStyle = 'rgba(255,255,255,.05)'; a.fillRect(0, y * rh + rh - 2, W, 2);
        }
      }
      break;
    case 'rack':
      for (let x = 0; x < cols; x++) {
        a.fillStyle = 'rgba(5,11,36,.55)'; a.fillRect(x * cw + 6, 10, cw - 12, Hh - 20);
        for (let y = 14; y < Hh - 14; y += 6) { a.fillStyle = 'rgba(255,255,255,.07)'; a.fillRect(x * cw + 8, y, cw - 16, 2); }
        for (let k = 0; k < 14; k++) {

      break;
    case 'corrugated':
      for (let x = 0; x < W; x += 8) { a.fillStyle = x % 16 ? 'rgba(255,255,255,.07)' : 'rgba(0,0,10,.18)'; a.fillRect(x, 0, 4, Hh); }
      a.fillStyle = '#0B1642'; a.fillRect(W * .62, Hh * .55, W * .2, Hh * .45);
      a.fillStyle = 'rgba(255,111,181,.0)';
      for (let x = 0; x < W; x += 20) { a.fillStyle = (x / 20) % 2 ? '#E9EDFF' : '#12225E'; a.fillRect(x, Hh - 18, 20, 18); }

      break;
    case 'hut':
      a.fillStyle = '#0B1642'; a.fillRect(W * .58, Hh * .42, W * .26, Hh * .58);
      glassFill(W * .14, Hh * .3, W * .3, Hh * .2); light(W * .14, Hh * .3, W * .3, Hh * .2);
      e.fillStyle = '#fff'; e.fillRect(W * .62, Hh * .36, W * .18, 8);
      break;
    default: // grid
      for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const px = x * cw + cw * .18, py = y * rh + rh * .22, w = cw * .64, h = rh * .52;
        glassFill(px, py, w, h);
        a.fillStyle = 'rgba(255,255,255,.12)'; a.fillRect(px - 1, py + h, w + 2, 2);

      const cx0 = Math.min(...members.map(a => a.x)) - 8, cx1 = Math.max(...members.map(a => a.x)) + 8;

  fillers.forEach(m => { m.emissiveIntensity = .35; m.roughness = .95; m.metalness = 0; fillerMats.push(m); });
  const fillerRoof = roofMat(77, 'gravel', '#111A44');
  const treeMat = new THREE.MeshStandardMaterial({ color: 0x17306A, roughness: .9 });
  for (let x = -150; x <= 150; x += 9) for (let z = -150; z <= 150; z += 9) {
    if (x > minX - 17 && x < maxX + 17 && z > minZ - 17 && z < maxZ + 17) continue;   // keep the ring road clear

    const offRoad = (c, half) => { const m = ((c % 36) + 36) % 36; return Math.min(m, 36 - m) > half + 2.3; };
    if (r() < .22) { const tx = x + r() * 3, tz = z + r() * 3; if (!offRoad(tx, 1) || !offRoad(tz, 1)) continue; const tree = cyl(0, 1, 2.6 + r() * 1.5, treeMat, 7); tree.position.set(tx, 1.5, tz); world.add(tree); continue; }

    if (!offRoad(bx, w / 2) || !offRoad(bz, dd / 2)) continue;
    const b = boxFacade(w, h, dd, fillers[Math.floor(r() * 4)], fillerRoof, bx, bz);
    if (d > 60) b.traverse(o => { o.castShadow = false; });     // far filler: no shadow pass (it is fogged anyway)

    const built = builderFor(a.type, a.name)(a, seed);
    const grp = built.group;
    grp.position.set(a.x, 0, a.z);

}

// visible part of the canvas: between the left rail and the dossier (desktop)
function insets() {
  const r = stage.getBoundingClientRect();
  if (window.innerWidth <= 760) return { left: 0, right: 0, w: r.width, h: r.height };
  const rail = $('#rail'), dos = $('#panel');
  const left = rail.offsetParent ? rail.getBoundingClientRect().right - 40 - r.left : 0;   // the district may slide a little under the translucent column
  const right = dos.offsetParent ? r.right - dos.getBoundingClientRect().left + 8 : 0;
  return { left: Math.max(0, left), right: Math.max(0, right), w: r.width, h: r.height };
}
function fitCamera(animate = false) {

  const aspect = Math.max(.3, visW / Math.max(1, ins.h));
  const halfV = THREE.MathUtils.degToRad(camera.fov) / 2, halfH = Math.atan(Math.tan(halfV) * aspect);

  if (sceneFit.corners?.length) {

    for (let i = 0; i < 6; i++) {

  camera.far = Math.max(1600, dist * 6); camera.updateProjectionMatrix();

  scene.fog.near = dist * 1.1; scene.fog.far = dist * 3.6;     // district stays clear, the city beyond fades into the horizon
  if (animate) { flyTo(pos, sceneFit.center); return; }

// ---------- motion: camera flights, bursts, intro ----------
let tween = null;
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function flyTo(pos, look, dur = 950) {
  if (reduceMotion) { camera.position.copy(pos); controls.target.copy(look); controls.update(); return; }
  tween = { start: performance.now(), dur, fromP: camera.position.clone(), fromT: controls.target.clone(), toP: pos.clone(), toT: look.clone() };
}
function focusAsset(id) {
  const n = nodes[id]; if (!n) return;
  const look = n.group.position.clone(); look.y = n.top * .4;
  const dist = Math.max(30, n.top * 2.4 + 22);
  flyTo(look.clone().addScaledVector(sceneFit.dir, dist), look);
}
const effects = [];
const ringGeo = new THREE.RingGeometry(1, 1.035, 96);   // thin: width grows with radius

  if (reduceMotion || S.split) return;

  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: new THREE.Color().setRGB(gc[0] * sk, gc[1] * sk, gc[2] * sk), transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));

}
function stepEffects(now) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i], k = (now - e.start) / e.dur;
    if (k < 0) continue;
    if (k >= 1) { world.remove(e.m); e.m.material.dispose(); effects.splice(i, 1); continue; }
    const q = 1 - Math.pow(1 - k, 3);

let introStart = 0;
const introK = (now, delay) => reduceMotion ? 1 : Math.min(1, Math.max(0, (now - introStart - delay) / 700));
const beamStart = {};
let prevT = 0;
function fireEvents(sim, from, to) {
  if (!sim || to <= from || to - from > 45) return;
  for (const e of sim.events) {
    if (e.t <= from || e.t > to) continue;
    if (e.kind === 'compromise') burst(e.asset, { r0: 2.5, r1: 11, dur: 950, atk: e.attacker || 'A' });
    if (e.kind === 'attacker_joins' && e.asset) burst(e.asset, { r0: 2, r1: 16, dur: 1200, atk: e.attacker });
    if (e.kind === 'failsafe') { const c = $('#clock'); c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash'); }
    if (e.kind === 'service_down') {
      const ak = e.attacker && ATK_HEX[e.attacker] ? e.attacker : 'A';
      if (e.asset_hint) { burst(e.asset_hint, { r0: 4, r1: 38, dur: 1700, strong: true, atk: ak }); burst(e.asset_hint, { r0: 3, r1: 26, dur: 1500, delay: 220, strong: true, atk: ak }); }
      const c = $('#clock'); c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash');

/** For each lost service, find the building whose fall broke it (used to place the shock ring). */

// ======================================================================
// painting state onto the scene
// ======================================================================
const tmpA = new THREE.Color(), tmpB = new THREE.Color(), tmpC = new THREE.Color();

// the attackers of a run: from /api/multi (sim.per) or, for a plain /api/simulate run, one attacker A from `entries`
function attackersOf(sim, entries) {

}
const sigT = now => (now - env.t0) / 1000;
const blinkOn = now => reduceMotion || (sigT(now) * 1.6) % 1 < .55;

  tmpC.setHex(st.hex || C.pink).multiplyScalar(2.2);

    const state = atk ? 10 + on + (st.hex % 997) * 2 : sigPhase(t, h.off, h.axis);
    if (state === h.last) return;

    for (let L = 0; L < 3; L++) b.setColorAt(i * 3 + L, atk ? (L === 1 && on ? tmpC : SIG.off) : (L === state ? SIG[['r', 'a', 'g'][L]] : SIG.off));

function paint(sim, T, fixIds, entries, now, withLabels) {

  list.sort((a, b) => (b._prio || 0) - (a._prio || 0));

          <span>Worst case</span><div class="bar worst"><span style="width:${Math.max(0, f.worst_case_reduction_pct)}%"></span></div><span class="v">−${f.worst_case_reduction_pct}%</span>

        ${f.note ? `<div class="note">${esc(f.note)}</div>` : ''}

}

function sensitivityBlock() {
  const s = S.sens;
  if (!s) return `
    <h3>Can you trust this order?</h3>
    <p class="hint">Every timing and weight in the model is an estimate. This test moves each one ${30}% down and up and checks whether the order holds.</p>
    <button class="btn" id="sensRun">Test the assumptions</button>`;
  const changed = s.runs.filter(r => !r.same_top1);
  return `
    <h3>Can you trust this order?</h3>
    <div class="stability num">${s.top1_stable} of ${s.total}<small>tests keep ${esc(s.base_top3[0])} first</small></div>
    <p class="hint">The same top three in ${s.top3_stable} of ${s.total} tests. Each test moves one estimate ${s.change_pct}% down or up.${changed.length ? ' The order depends most on the estimates marked below.' : ' No single estimate changes the first choice.'}</p>
    ${s.runs.map(r => `<div class="run ${r.same_top1 ? '' : 'changed'}"><span class="what">${esc(r.label)}</span><span class="change">${r.change_pct > 0 ? '+' : '−'}${Math.abs(r.change_pct)}%</span>
      <span class="result">${r.same_top1 ? 'Same first fix' : `First fix becomes ${esc(r.top3[0])}`}</span></div>`).join('')}`;
}

      LIVE.seen = inc.id; LIVE.on = true;
      document.querySelector('[data-tab="replay"]')?.click();
      setEntries([s.asset], true);
      focusAsset(s.asset);
    }
    if (LIVE.on && inc) showBanner(inc.state === 'awaiting_operator' ? `LIVE ALARM ${inc.opened_at}: real Modbus attack on the emulated ${s.asset}. Spread from it is simulated.`
      : inc.state === 'isolated' ? `LIVE: ${s.asset} isolated, attacker cut off. Spread shown is simulated.`
      : inc.state === 'recovered' ? `LIVE: ${s.asset} recovered, known-good settings restored.` : `LIVE: alarm dismissed by the operator.`, inc.state === 'awaiting_operator');
    else if (LIVE.on && !inc) { LIVE.on = false; hideBanner(); }
  } catch { /* backend restarting */ }
}
setInterval(pollLive, 2500);
(async function boot() {
  setClock('T+00:00');
  try { [S.graph, S.overview] = await Promise.all([api('/api/graph'), api('/api/overview')]); } catch { return; }
  $('#scrub').max = H();
  await document.fonts.ready.catch(() => {});
  busy = S.graph.assets.length > 14;
  topRisk = new Set(S.graph.assets.slice().sort((a, b) => b.risk - a.risk).slice(0, 5).map(a => a.id));
  api('/api/dataset').then(d => { const n = $('#simnote'); n.textContent = `Simulated, ${d.assets} systems`; n.title = `Simulated district of ${d.assets} systems (${d.folder}). All infrastructure data is modelled; CVEs, KEV and EPSS are real.`; }).catch(() => {});
  buildScene(S.graph);
  setQuality(quality);
  introStart = performance.now();
  resize();
  renderPanel(); updateTimeUI();
  requestAnimationFrame(frame);
})();
</script>
